<title>Europe Accessibility Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --paper:#F6F3EC; --ink:#1A1916; --ink-2:#5D5A52; --rule:#D9D3C6;
  --accent:#E2401B; --nodata:#E9E4D9;
  --s0:#F3E2DA; --s1:#EBBFAE; --s2:#E39A81; --s3:#DA7355; --s4:#CF4B2C; --s5:#9F2C13;
  --shadow:0 12px 40px rgba(26,25,22,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --paper:#171614; --ink:#F1ECE2; --ink-2:#A39E92; --rule:#33302A; --nodata:#24221E;
  --s0:#3A241D; --s1:#5E2F22; --s2:#83402B; --s3:#AD4E2E; --s4:#D75C33; --s5:#F58358; --accent:#F0602F;
  --shadow:0 12px 40px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  color-scheme:dark; --paper:#171614; --ink:#F1ECE2; --ink-2:#A39E92; --rule:#33302A; --nodata:#24221E;
  --s0:#3A241D; --s1:#5E2F22; --s2:#83402B; --s3:#AD4E2E; --s4:#D75C33; --s5:#F58358; --accent:#F0602F;
  --shadow:0 12px 40px rgba(0,0,0,.4);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;letter-spacing:.01em;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 64px;padding-inline:20px}
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:24px}
h1{margin:0;font-size:44px;font-weight:400;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.lede{font-size:18px;color:var(--ink-2);max-width:56ch;margin:12px 0 0}
.lede b{color:var(--ink);font-weight:500}
.big{text-align:right}
.big .n{font-size:64px;color:var(--accent);line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.big .l{font-size:15px;color:var(--ink-2)}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px}
.mapbox{position:relative}
svg{width:100%;height:auto;display:block}
.country{stroke:var(--paper);stroke-width:.6;cursor:pointer;transition:opacity .2s}
.country.nodata{fill:var(--nodata);cursor:default}
.country.dim{opacity:.35}
.country.hot{stroke:var(--ink);stroke-width:1.2}
.country:focus{outline:none;stroke:var(--ink);stroke-width:1.4}
.legend{display:flex;align-items:center;gap:0;margin-top:12px;flex-wrap:wrap}
.legend .sw{width:44px;height:14px}
.legend .lab{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink-2);margin-left:8px;margin-right:16px}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);padding:10px 14px;min-width:190px;font-size:15px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip .name{font-weight:500;font-size:18px}
.tip .pct{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.tip .meta{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink-2)}
aside h2{font-size:15px;font-weight:500;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.rank li:hover,.rank li.hot{color:var(--accent)}
.rank .i{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink-2)}
.rank .bar{height:6px;background:var(--rule);position:relative;margin-top:4px}
.rank .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.rank .v{font-variant-numeric:tabular-nums;font-weight:500}
.rank li.eea .nm::after{content:" · EEA";font-size:14px;color:var(--ink-2);font-weight:400}
.rank li.nd{cursor:default;color:var(--ink-2)}
.rank li.nd .v{font-weight:400;font-family:"JetBrains Mono",monospace;font-size:14px}
.detail{margin-top:24px;border-top:1px solid var(--rule);padding-top:16px}
.detail h2{font-size:18px;font-weight:500;margin:0 0 10px}
.detail table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.detail th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:400;color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--rule)}
.detail td{padding:5px 0;border-bottom:1px solid var(--rule)}
.detail td:not(:first-child),.detail th:not(:first-child){text-align:right}
.detail .meta{font-size:15px;color:var(--ink-2)}
.rank li .i{white-space:nowrap}
.src{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--rule);width:max-content;max-width:100%;overflow-x:auto}
.src button{font:inherit;font-size:15px;letter-spacing:.01em;background:none;border:0;border-right:1px solid var(--rule);padding:9px 16px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.src button:last-child{border-right:0}
.src button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.src button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
footer{margin-top:40px;border-top:1px solid var(--rule);padding-top:16px;color:var(--ink-2);font-size:15px;max-width:70ch}
footer a{color:var(--ink)}
@media (max-width:820px){main{grid-template-columns:1fr}header{grid-template-columns:1fr}.big{text-align:left}h1{font-size:36px}.big .n{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="big"><div class="n" id="avg">–</div><div class="l" id="avgl"></div></div>
</header>

<div class="src" role="group" aria-label="Data source" id="src">
  <button type="button" data-s="scan" aria-pressed="true">Accessible Scan · 27 countries</button>
  <button type="button" data-s="dti" aria-pressed="false">Digital Trust Index 2026 · 18</button>
  <button type="button" data-s="webaim" aria-pressed="false">WebAIM Million 2026 · 7</button>
</div>

<main>
  <div class="mapbox">
    <svg id="map" viewBox="0 0 760 640" role="img" aria-label="Choropleth map of Europe: website accessibility by country"></svg>

    <section id="detail" class="detail" hidden aria-live="polite"></section>
  </div>
  <aside>
    <h2 id="rankh"></h2>
    <ol class="rank" id="rank"></ol>
  </aside>
</main>

<footer id="foot"></footer>
</div>

const DTI={"Norway":[15.59,5105,1],"Finland":[14.56,5405],"Sweden":[14.06,9985],"Austria":[11.42,10905],"Germany":[9.92,79276],"Italy":[9.90,32617],"Denmark":[9.76,9014],"Belgium":[8.86,9577],"Netherlands":[8.23,38433],"Spain":[7.33,16980],"France":[7.28,31655],"Portugal":[6.10,6838],"Czechia":[5.71,12666],"Greece":[5.48,9124],"Poland":[5.36,24902],"Slovakia":[5.06,4962],"Hungary":[5.03,8237],"Romania":[4.24,10569]};
const WEBAIM={"Netherlands":[45.5,12660,"nl"],"Germany":[46.3,28401,"de"],"France":[53.3,11335,"fr"],"Spain":[57.0,6401,"es"],"Italy":[59.5,11314,"it"],"Poland":[67.1,10203,"pl"],"Czechia":[73.2,5700,"cz"]};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ramp=()=>['--s0','--s1','--s2','--s3','--s4','--s5'].map(css);

const SOURCES={
 scan:{
  eyebrow:'Accessible Scan · 295 homepages · 27 EU countries · scanned 26 Sep 2026',
  h1:'How accessible are each EU country\u2019s most-visited websites?',
  lede:'We ran the 15 most-visited domains of every EU country\u2019s ccTLD (Tranco ranking) through our own scanner. Colour is the <b>mean score out of 100</b>. Only <b>2 of 295</b> homepages had zero provable WCAG A/AA faults \u2014 and both are empty placeholder pages.',
  big:()=>{const a=Object.values(SCAN).flatMap(c=>c.sites);return (a.reduce((s,x)=>s+x.s,0)/a.length).toFixed(1)}, bigl:'mean score across all 295 scanned homepages',
  rankh:'Ranked by mean score', unit:'/ 100', legendl:'mean score / 100',
  steps:[0,10,20,30,40,50,100], higherBetter:true, barMax:60,
  data:Object.fromEntries(Object.entries(SCAN).map(([k,v])=>[k,{v:v.score,n:v.n,fmt:x=>x.toFixed(0)}])),
  tip:(k)=>{const d=SCAN[k];return `${d.n} of ${d.tried} scanned \u00b7 median ${d.faults} A/AA faults \u00b7 ${d.pass.toFixed(0)}% pass<br>best ${d.sites[0].d} (${d.sites[0].s})`},
  detail:(k)=>{const d=SCAN[k];return `<h2>${k} \u00b7 ${d.n} homepages</h2><table><thead><tr><th>Site</th><th>Score</th><th>A/AA faults</th></tr></thead><tbody>${d.sites.map(s=>`<tr><td>${s.d}</td><td>${s.s}</td><td>${s.f}</td></tr>`).join('')}</tbody></table>${d.unreachable.length?`<p class="meta">Could not be scanned: ${d.unreachable.join(', ')}</p>`:''}`},
  foot:'Method: for each EU member we took the first 15 registrable domains under its country TLD in the <a href="https://tranco-list.eu/">Tranco</a> top-1M list (URL shorteners, google/amazon mirrors and adult sites removed) and scanned the homepage with Accessible Scan\u2019s automated layer (axe-core plus our own checks, no AI review) in headless Chromium on 26 Sep 2026. Score is the report\u2019s 0\u2013100 score, which counts only provable WCAG A/AA faults. \u201cFaults\u201d is the median count per country. 110 sites could not be scanned \u2014 bot-blocking (HTTP 403/511), invalid certificates, or pages that never finished loading in 60 s \u2014 and are excluded; <i>n</i> shows how many were scanned. Fifteen sites a country is a small sample: read the map as a sketch, not a league table.',
  nodata:k=>'Not in the EU \u2014 not scanned'
 },
 dti:{
  eyebrow:'Digital Trust Index · 326,250 homepages · 18 countries · 2026',
  h1:'Share of websites that pass automated WCAG checks, by country',
  lede:'A homepage counts as passing when it clears all <b>61 automated tests</b> \u2014 colour contrast, link and image names, form labels. Automated checks catch roughly a third of WCAG criteria, so these are ceilings, not floors.',
  big:()=>{const e=Object.values(DTI);return (e.reduce((a,[p,n])=>a+p*n,0)/e.reduce((a,[,n])=>a+n,0)).toFixed(1)+'%'}, bigl:'pass, weighted across all tested pages',

  nodata:k=>'Not in the 2026 sample'
 },
 webaim:{
  eyebrow:'WebAIM Million · 1,000,000 homepages · February 2026',
  h1:'Average detectable WCAG 2 errors per homepage, by country domain',
  lede:'WebAIM\u2019s yearly WAVE analysis of the top million homepages: <b>95.9%</b> had detectable WCAG 2 failures, <b>56.1 errors</b> per page on average. It reports by top-level domain, so only the seven EU ccTLDs it lists can be mapped. <b>Lower is better.</b>',
  big:()=>'56.1', bigl:'errors per homepage, all one million pages',

 }
};

let cur='scan', features=null;
const $=id=>document.getElementById(id);
const tip=$('tip'), box=document.querySelector('.mapbox'), rank=$('rank'), detail=$('detail');

function colorFor(S){
  const r=ramp(); if(S.higherBetter) r.reverse();
  return d3.scaleThreshold().domain(S.steps.slice(1,-1)).range(r);
}
function render(){
  const S=SOURCES[cur], color=colorFor(S);
  $('eyebrow').textContent=S.eyebrow; $('h1').textContent=S.h1; $('lede').innerHTML=S.lede;
  $('avg').textContent=S.big(); $('avgl').textContent=S.bigl; $('rankh').textContent=S.rankh; $('foot').innerHTML=S.foot;
  detail.hidden=true; hide();
  const lg=$('legend'); lg.innerHTML='';
  color.range().forEach((c,i)=>{lg.insertAdjacentHTML('beforeend',`<span class="sw" style="background:${c}"></span><span class="lab">${i===0&&S.steps[0]===0?'< '+S.steps[1]: i===5? S.steps[5]+'+' : S.steps[i]+'\u2013'+S.steps[i+1]}</span>`)});
  lg.insertAdjacentHTML('beforeend',`<span class="lab" style="margin-left:0">${S.legendl}</span>`);
  rank.innerHTML='';
  const sorted=Object.entries(S.data).sort((a,b)=>S.higherBetter?b[1].v-a[1].v:a[1].v-b[1].v);
  sorted.forEach(([k,d],i)=>rank.insertAdjacentHTML('beforeend',`<li data-c="${k}" class="${d.eea?'eea':''}"><span class="i">${String(i+1).padStart(2,'0')}</span><span><span class="nm">${k}</span>${cur==='scan'?` <span class="i">n=${d.n}</span>`:''}<div class="bar"><i style="width:${Math.min(100,d.v/S.barMax*100)}%"></i></div></span><span class="v">${d.fmt(d.v)}</span></li>`));
  if(!features) return;
  const svg=d3.select('#map');
  svg.selectAll('path.country').data(features).join('path')
    .attr('class',d=>'country'+(S.data[d.properties.name]?'':' nodata'))
    .attr('fill',d=>S.data[d.properties.name]?color(S.data[d.properties.name].v):null)
    .attr('tabindex',d=>S.data[d.properties.name]?0:-1)
    .attr('role',d=>S.data[d.properties.name]&&S.detail?'button':null)
    .attr('aria-label',d=>S.data[d.properties.name]?`${d.properties.name}: ${S.data[d.properties.name].fmt(S.data[d.properties.name].v)} ${S.unit}`:d.properties.name);
  const small=['Luxembourg','Malta','Cyprus','Slovenia','Belgium'];
  svg.select('g.labels').selectAll('text').data(features.filter(d=>S.data[d.properties.name]&&!small.includes(d.properties.name))).join('text')
    .attr('transform',d=>`translate(${window.__path.centroid(d)})`).attr('text-anchor','middle').attr('dy','.35em')
    .attr('font-size',11).attr('font-family','JetBrains Mono,monospace').attr('pointer-events','none')
    .attr('fill',d=>{const c=color(S.data[d.properties.name].v);return [css('--s3'),css('--s4'),css('--s5')].includes(c)?css('--paper'):css('--ink')})
    .text(d=>S.data[d.properties.name].fmt(S.data[d.properties.name].v));
}
function show(name,ev){
  const S=SOURCES[cur], d=S.data[name];
  tip.innerHTML=d?`<div class="name">${name}${d.eea?' <span class="meta">EEA</span>':''}</div><div class="pct">${d.fmt(d.v)}<span class="meta"> ${S.unit}</span></div><div class="meta">${S.tip(name)}</div>`
    :`<div class="name">${name}</div><div class="meta">${S.nodata(name)}</div>`;
  tip.classList.add('on');
  if(ev){const r=box.getBoundingClientRect();let x=ev.clientX-r.left+16,y=ev.clientY-r.top+16;if(x+260>r.width)x-=280;tip.style.left=x+'px';tip.style.top=y+'px';}
}
function hide(){tip.classList.remove('on')}
function hot(name,on){
  const S=SOURCES[cur];
  d3.selectAll('.country').classed('hot',d=>on&&d.properties.name===name).classed('dim',d=>on&&d.properties.name!==name&&S.data[d.properties.name]);
  rank.querySelectorAll('li').forEach(li=>li.classList.toggle('hot',on&&li.dataset.c===name));
}
function select(name){
  const S=SOURCES[cur]; if(!S.detail||!S.data[name]) return;
  detail.hidden=false; detail.innerHTML=S.detail(name); detail.scrollIntoView({behavior:'smooth',block:'nearest'});
}
rank.addEventListener('mouseover',e=>{const li=e.target.closest('li');if(li)hot(li.dataset.c,true)});
rank.addEventListener('mouseout',()=>hot(null,false));
rank.addEventListener('click',e=>{const li=e.target.closest('li');if(li)select(li.dataset.c)});
$('src').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.s;$('src').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});

render();
fetch('eu.json').then(r=>r.json()).then(topo=>{
  features=topojson.feature(topo,topo.objects.countries).features;
  const proj=d3.geoConicConformal().parallels([40,65]).rotate([-12,0]).center([0,54]).scale(1000).translate([380,320]);
  const path=window.__path=d3.geoPath(proj);
  const svg=d3.select('#map');
  svg.append('g').attr('class','shapes').selectAll('path').data(features).join('path').attr('class','country nodata').attr('d',path)
    .on('mousemove',(e,d)=>{show(d.properties.name,e);hot(d.properties.name,true)})
    .on('mouseleave',()=>{hide();hot(null,false)})
    .on('click',(e,d)=>select(d.properties.name))
    .on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d.properties.name)}})
    .on('focus',(e,d)=>{const b=e.target.getBBox(),r=box.getBoundingClientRect(),s=r.width/760;tip.style.left=(b.x+b.width)*s+'px';tip.style.top=b.y*s+'px';show(d.properties.name);hot(d.properties.name,true)})
    .on('blur',()=>{hide();hot(null,false)});
  svg.append('g').attr('class','labels');
  render();
});
</script>
