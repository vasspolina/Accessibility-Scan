<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- width=device-width so phones render at their real width instead of a
         zoomed-out 980px canvas. No maximum-scale / user-scalable: pinch zoom
         stays available (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A11y Widget (Business) — Dev</title>
    <style>
      /* Explicit page colours (axe cannot judge contrast against a
         transparent body), following the visitor's colour-scheme setting so
         the host page and the widget agree in dark mode. */
      body {
        /* The UA default is 8px, which production does not have (demo.html
           resets it). Left in, the harness reported a 24px horizontal
           scrollbar at 320px that the real embed never had — a false signal
           that cost a round of chasing. */
        margin: 0;
        background: #ffffff;
        color: #161616;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161616;
          color: #f4f4f4;
        }
      }
      /* Skip link: first focusable element on the page, visible on focus. */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        background: #0f62fe;
        color: #fff;
        padding: 8px 16px;
        z-index: 10;
      }
      .skip-link:focus {
        left: 0;
        outline: 2px solid #161616;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="skip-link" href="#main">Skip to main content</a>
    </header>
    <!-- Wrapped in <main> because this harness gets scanned like any other
         page, and orphaned content outside a landmark is a finding we report
         on other people's sites. A test page for an accessibility tool should
         not fail the tool. -->
    <main id="main">
      <h1>Host page content (unrelated to the widget)</h1>
      <p>This paragraph exists to prove host-page styles don't leak into the widget below.</p>

      <!-- The CTA attributes exist so the dev harness exercises the embedder-configured
           call-to-action; the public demo page deliberately carries none. -->
      <div
        id="a11y-widget-business-root"
      data-plans='[{"name":"Starter","price":"£19","note":"a month","href":"https://example.com/starter"},{"name":"Business","price":"£49","note":"a month","href":"https://example.com/business","featured":true},{"name":"Agency","price":"£99","note":"a month","href":"https://example.com/agency"}]'
        data-api-base="https://a11y-checker-v2-production.up.railway.app"
        data-cta-text="Book a fix-it consultation"
        data-cta-href="https://example.com/consult"
      ></div>
    </main>

    <!-- Dev-only test harness: no-op without ?fixture in the URL. Stubs the
         scan API with canned reports and loads axe-core so every view can be
         rendered and audited without a backend. -->
    <script src="/dev-fixture.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
