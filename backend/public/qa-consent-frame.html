<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QA: consent banner served in a frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #111; }
      main { padding: 24px; max-width: 40em; }
      iframe { position: fixed; inset: auto 0 0 0; width: 100%; height: 240px; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Test page for a consent banner in a frame</h1>
      <!--
        Decoys, and the reason this page exists.

        The banner's selector is a path through the FRAME's document, and the
        capture pass runs against this document unless it is told where the
        banner actually came from. These divs give that path something to land
        on here, which is what makes the failure visible: on spiegel.de the
        real banner's path matched two unrelated elements in the host page, and
        the first of them is what got photographed and shipped as evidence.
      -->
      <div>
        <div>
          <div>
            <div>
              <div>Nothing to do with consent. This is the page's own content.</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <iframe src="qa-consent-frame-inner.html" title="Cookie consent"></iframe>
  </body>
</html>
