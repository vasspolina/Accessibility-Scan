<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QA: consent frame contents</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #fff; }
      .banner { padding: 16px; border-top: 2px solid #333; }
      button { font: inherit; padding: 10px 18px; background: #d33; color: #fff; border: none; }
      a { font-size: 12px; }
    </style>
  </head>
  <body>
    <!--
      The banner itself, served from its own document exactly as a consent
      management platform serves it. Accept is a solid button; there is no
      refusal beside it at all.
    -->
    <div class="banner">
      <h2>With advertising and tracking</h2>
      <p>
        This site stores and processes data for personalised advertising in
        cooperation with third party providers. Your cookie consent can be
        withdrawn at any time.
      </p>
      <button type="button">Consent and continue</button>
      <a href="#">Privacy settings</a>
    </div>
  </body>
</html>
