<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessibility checker — demo</title>
    <style>
      body {
        /* PP Telegraf arrives via the widget's injected @font-face; the
           stack falls back to the system face until it loads. */
        font-family: "PP Telegraf", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.01em;
        margin: 0;
        padding: 32px 16px 64px;
        background: #f4f4f4;
        color: #161616;
      }
      /* Full width. The widget sizes and centres itself against the viewport,
         so giving it a column here as well made the two multiply. This page's
         own text is aligned to the panel by the rule below instead. */
      .page { width: 100%; margin: 0; }
      .page > h1, .page > h2, .page > p, .page > ul {
        /* Kept in step with the widget's own cap so the host copy and the
           panel share one column. */
        width: min(100%, 48rem);
        /* Our own line-length rule flagged this page at ~97 characters a
           line; the cap keeps the measure readable at wide viewports. */
        max-width: 66ch;
        margin-inline: auto;
      }
      h1 { font-size: 28px; line-height: 36px; margin: 0 0 8px; font-weight: 400; }
      p.lede { font-size: 16px; line-height: 1.5; color: #525252; margin: 0 0 32px; }
      .try-title { font-size: 18px; font-weight: 500; margin: 40px 0 0; }
      .try { font-size: 14px; line-height: 1.5; color: #525252; margin: 8px 0 0; }
      /* Buttons, not decorated text: our own scan flagged the previous
         code-chip styling as implying a click it never delivered. Each one
         fills the scanner input above. A list beside the prose, not inside
         it — inline chips inside a paragraph made the measure unmeasurable
         (our line-length rule counts their labels as running text). */
      .try-list {
        list-style: none;
        padding: 0;
        margin: 8px auto 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .try-list button {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 14px;
        background: #e0e0e0; padding: 2px 8px;
        border: 1px solid #8d8d8d; border-radius: 4px;
        color: #161616; cursor: pointer;
      }
      .try-list button:hover { background: #d1d1d1; }
      .try-list button:focus-visible { outline: 2px solid #0f62fe; outline-offset: 1px; }
      /* The widget follows the visitor's scheme; the page around it should
         too, or a dark report sits in a glowing light frame. Same Carbon
         ramp the design system uses. */
      @media (prefers-color-scheme: dark) {
        body { background: #161616; color: #f4f4f4; }
        p.lede, .try { color: #c6c6c6; }
        .try-list button {
          background: #262626; border-color: #6f6f6f; color: #f4f4f4;
        }
        .try-list button:hover { background: #333333; }
        .try-list button:focus-visible { outline-color: #ffffff; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Accessibility checker</h1>
      <p class="lede">
        Enter any public web address to scan it. The widget below is the
        embeddable one, running against this service.
      </p>

      <!-- Both major sections carry a heading: the self-scan flagged a page
           where the examples had one and the checker itself did not. -->
      <h2 class="try-title">Check a site</h2>

      <!-- The embed itself, exactly as a client would paste it. The address is
           written out rather than derived from window.location: this service
           sends script-src 'self' with no unsafe-inline, so a one-line inline
           script to fill it in is blocked, and the page renders empty with
           nothing in the console to say why. -->
      <div
        id="a11y-widget-business-root"
        data-api-base="https://a11y-checker-v2-production.up.railway.app"
      ></div>

      <h2 class="try-title">Try an example</h2>
      <p class="try">
        Consent banners in a language other than English are worth trying.
        Each button fills the address in for you.
      </p>
      <ul class="try-list">
        <li><button type="button" data-domain="bundesregierung.de" aria-label="Fill in bundesregierung.de">bundesregierung.de</button></li>
        <li><button type="button" data-domain="spiegel.de" aria-label="Fill in spiegel.de">spiegel.de</button></li>
        <li><button type="button" data-domain="dr.dk" aria-label="Fill in dr.dk">dr.dk</button></li>
        <li><button type="button" data-domain="corriere.it" aria-label="Fill in corriere.it">corriere.it</button></li>
        <!-- The exception is named on the button itself, not in prose a list
             reader never meets: this banner is correct, and the scan should
             say so by staying silent about it. -->
        <li><button type="button" data-domain="gov.pl"
          aria-label="Fill in gov.pl — correct banner">gov.pl
          — correct banner</button></li>
      </ul>
    </main>

    <script src="./widget-business.js" defer></script>
    <!-- External file, not inline: this service's CSP is script-src 'self'
         with no unsafe-inline. -->
    <script src="./demo.js" defer></script>
  </body>
</html>
