<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessibility checker — demo</title>
    <style>
      /* Barebones by request: browser defaults. The one rule left exists
         because unstyled pages read at 200+ characters a line on a wide
         screen — the readability floor, not decoration. */
      body { max-width: 70ch; margin: 0 auto; padding: 1rem; }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Accessibility checker</h1>
      <p class="lede">
        Enter any public web address to scan it. The widget below is the
        embeddable one, running against this service.
      </p>

      <!-- Both major sections carry a heading: the self-scan flagged a page
           where the examples had one and the checker itself did not. -->
      <h2 class="try-title">Check a site</h2>

      <!-- The embed itself, exactly as a client would paste it. The address is
           written out rather than derived from window.location: this service
           sends script-src 'self' with no unsafe-inline, so a one-line inline
           script to fill it in is blocked, and the page renders empty with
           nothing in the console to say why. -->
      <div
        id="a11y-widget-business-root"
        data-api-base="https://a11y-checker-v2-production.up.railway.app"
      ></div>

      <h2 class="try-title">Try an example</h2>
      <p class="try">
        Consent banners in a language other than English are worth trying.
        Each button fills the address in for you.
      </p>
      <ul class="try-list">
        <li><button type="button" data-domain="bundesregierung.de" aria-label="Fill in bundesregierung.de">bundesregierung.de</button></li>
        <li><button type="button" data-domain="spiegel.de" aria-label="Fill in spiegel.de">spiegel.de</button></li>
        <li><button type="button" data-domain="dr.dk" aria-label="Fill in dr.dk">dr.dk</button></li>
        <li><button type="button" data-domain="corriere.it" aria-label="Fill in corriere.it">corriere.it</button></li>
        <!-- The exception is named on the button itself, not in prose a list
             reader never meets: this banner is correct, and the scan should
             say so by staying silent about it. -->
        <li><button type="button" data-domain="gov.pl"
          aria-label="Fill in gov.pl — correct banner">gov.pl
          — correct banner</button></li>
      </ul>
    </main>

    <script src="./widget-business.js" defer></script>
    <!-- External file, not inline: this service's CSP is script-src 'self'
         with no unsafe-inline. -->
    <script src="./demo.js" defer></script>
  </body>
</html>
